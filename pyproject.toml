[project]
name = "MioFFAn_LLM_processor"
version = "0.1.0"
description = "LLM backend for MioFFAn annotator."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.1",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "lxml>=5.2",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "rdflib>=7.0",
    "owlrl>=7.0",
    "pypandoc>=1.17",
    "tangent_l_with_slt_matching @ git+https://github.com/NicolasSR/Tangent-L-with-SLT-Matching.git@master"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]